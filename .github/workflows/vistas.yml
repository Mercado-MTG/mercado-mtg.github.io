# Cada 15 minutos genera las páginas con vista previa de las cartas en venta (c/<id>/)
name: Vistas previas de cartas
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vistas
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generar-vistas.mjs
      - name: Guardar cambios
        run: |
          git config user.name "mercado-mtg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add c
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Vistas previas de cartas" && git push; fi

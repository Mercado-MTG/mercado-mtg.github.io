<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
<script>if (location.hostname === "mercado-mtg.github.io") location.replace("https://mercado-mtg.pages.dev" + location.pathname + location.search + location.hash); // dirección nueva</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mercado MTG</title>
  <meta name="description" content="Compra y vende cartas de Magic: The Gathering en Perú: elige cómo pagar y dónde recibir, y coordina por WhatsApp con vendedores con reputación.">
  <meta name="theme-color" content="#0c0a1a">
  <meta property="og:title" content="Mercado MTG">
  <meta property="og:description" content="Compra y vende cartas de Magic en Perú, recibe alertas de las cartas que buscas y juega Commander en línea con mesas por bracket.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="logo-512.png">
  <meta property="og:image" content="https://mercado-mtg.pages.dev/logo-512.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0c0a1a; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    /* pantalla de carga mientras Apps Script responde */
    #cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #0c0a1a; color: #c7c0d6; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .35s; }
    #cargando.fuera { opacity: 0; pointer-events: none; }
    #cargando .marca { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; animation: latido 1.2s ease-in-out infinite; }
    @keyframes latido { 50% { transform: scale(.9); opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { #cargando .marca { animation: none; } }
  </style>
</head>
<body>
  <!-- La app corre en Google Apps Script (ver apps-script/); aquí solo se muestra.
       credentialless: carga sin las sesiones de Google del visitante, así no falla
       cuando hay varias cuentas abiertas. -->
  <iframe
    id="app"
    credentialless
    data-src="https://script.google.com/macros/s/AKfycbxn5R4v8c-0SpumGkuwnUhzcjhSr6-o_EBaoj8Uclo5RU7NEfcepyT0vcri1yPnnynd3Q/exec"
    title="Mercado MTG"
    allow="clipboard-write; fullscreen; screen-wake-lock"
    allowfullscreen></iframe>
  <div id="cargando" aria-live="polite">
    <div class="marca" aria-hidden="true">
      <img src="logo.png" alt="" width="72" height="72" style="display:block">
    </div>
    Cargando Mercado MTG…
  </div>
  <script>
    // El iframe credentialless pierde su almacenamiento al recargar: la sesión y el idioma se guardan aquí.
    // Solo se atiende a la app de Apps Script (sus marcos se sirven desde googleusercontent.com).
    (function () {
      var CLAVE = 'mtg_token';
      function esLaApp(origen) { return /^https:\/\/[a-z0-9-]+[.-]script\.googleusercontent\.com$/.test(origen); }
      window.addEventListener('message', function (e) {
        if (!esLaApp(e.origin) || !e.data || typeof e.data !== 'object') return;
        try {
          if (e.data.tipo === 'mtg-guardar-token') {
            var t = String(e.data.token || '').slice(0, 200);
            if (t) localStorage.setItem(CLAVE, t); else localStorage.removeItem(CLAVE);
          } else if (e.data.tipo === 'mtg-pedir-token') {
            e.source.postMessage({ tipo: 'mtg-token', token: localStorage.getItem(CLAVE) || '' }, e.origin);
          } else if (e.data.tipo === 'mtg-guardar-idioma') {
            localStorage.setItem('mtg_lang', e.data.idioma === 'en' ? 'en' : 'es');
          } else if (e.data.tipo === 'mtg-pedir-idioma') {
            e.source.postMessage({ tipo: 'mtg-idioma', idioma: localStorage.getItem('mtg_lang') || '', dicc: localStorage.getItem('mtg_tr_en3') || '' }, e.origin);
          } else if (e.data.tipo === 'mtg-guardar-dicc') {
            localStorage.setItem('mtg_tr_en3', String(e.data.dicc || '').slice(0, 3000000)); // traducciones al inglés ya hechas
          } else if (e.data.tipo === 'mtg-google-pedir') {
            pedirGoogle(e.source, e.origin, String(e.data.clientId || ''));
          }
        } catch (x) { }
      });

      // "Continuar con Google": Google solo muestra su botón en un dominio registrado (este), no dentro de la app.
      // Se abre una ventanita con el botón; la credencial que da Google se le pasa a la app, que la verifica.
      var gsiCargado = null;
      function cargarGsi(listo) {
        if (window.google && google.accounts && google.accounts.id) return listo();
        if (!gsiCargado) {
          gsiCargado = [];
          var s = document.createElement('script');
          s.src = 'https://accounts.google.com/gsi/client';
          s.async = true;
          s.onload = function () { gsiCargado.forEach(function (f) { f(); }); gsiCargado = 'ok'; };
          document.head.appendChild(s);
        }
        if (gsiCargado === 'ok') listo(); else gsiCargado.push(listo);
      }
      function pedirGoogle(marco, origen, clientId) {
        if (!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(clientId)) return;
        var viejo = document.getElementById('gCapa');
        if (viejo) viejo.remove();
        var capa = document.createElement('div');
        capa.id = 'gCapa';
        capa.style.cssText = 'position:fixed;inset:0;background:rgba(10,8,20,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px';
        capa.innerHTML = '<div style="background:#fff;color:#1f1f1f;border-radius:18px;padding:24px;max-width:340px;width:100%;text-align:center;font:500 14px system-ui,-apple-system,Segoe UI,sans-serif">' +
          '<img src="logo.png" alt="" width="56" height="56" style="border-radius:14px"><h2 style="font-size:18px;margin:10px 0 6px">Entrar a Mercado MTG</h2>' +
          '<p style="margin:0 0 16px;color:#555">Elige tu cuenta de Google. Tu correo no se muestra a nadie.</p>' +
          '<div id="gBoton" style="display:flex;justify-content:center;min-height:44px"></div>' +
          '<button type="button" id="gCancelar" style="margin-top:14px;background:none;border:0;color:#555;font:inherit;text-decoration:underline;cursor:pointer">Cancelar</button></div>';
        document.body.appendChild(capa);
        function cerrar(tipo) { capa.remove(); if (tipo) marco.postMessage({ tipo: tipo }, origen); }
        document.getElementById('gCancelar').onclick = function () { cerrar('mtg-google-cancelado'); };
        capa.onclick = function (ev) { if (ev.target === capa) cerrar('mtg-google-cancelado'); };
        cargarGsi(function () {
          google.accounts.id.initialize({
            client_id: clientId,
            callback: function (r) {
              cerrar('');
              marco.postMessage({ tipo: 'mtg-google', credencial: r.credential }, origen);
            }
          });
          google.accounts.id.renderButton(document.getElementById('gBoton'),
            { theme: 'filled_blue', size: 'large', text: 'continue_with', shape: 'pill', locale: 'es', width: 280 });
        });
      }
      // la app se carga aquí para pasarle ?carpeta=nick (enlaces para compartir una carpeta)
      var app = document.getElementById('app');
      var carpeta = (new URLSearchParams(location.search).get('carpeta') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 24);
      // ?venta=id abre una carta y ?sala=CODIGO invita a una mesa (enlaces compartidos por WhatsApp)
      var q = new URLSearchParams(location.search);
      var venta = (q.get('venta') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
      var sala = (q.get('sala') || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 5);
      var params = [];
      if (carpeta) params.push('carpeta=' + encodeURIComponent(carpeta));
      if (venta) params.push('venta=' + encodeURIComponent(venta));
      if (sala) params.push('sala=' + encodeURIComponent(sala));
      app.src = app.getAttribute('data-src') + (params.length ? '?' + params.join('&') : '');
      var cargando = document.getElementById('cargando');
      function ocultar() { cargando.classList.add('fuera'); }
      document.getElementById('app').addEventListener('load', function () { setTimeout(ocultar, 400); });
      setTimeout(ocultar, 12000);
    })();
  </script>
  <!-- chat de voz de las mesas (el micrófono solo se puede usar desde esta página) -->
  <script src="voz.js"></script>
</body>
</html>
